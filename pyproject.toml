[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bielik-tools"
version = "0.1.0"
description = "vLLM tool-calling and reasoning parser plugins for Bielik language models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "SpeakLeash" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# vLLM is intentionally not declared as a dependency: the plugin is installed
# into an environment that already provides a vLLM build matching the user's
# hardware, and the matching parser is selected at runtime.
dependencies = []

[project.urls]
Homepage = "https://github.com/speakleash/bielik-tools"

[project.entry-points."vllm.general_plugins"]
bielik = "bielik_tools.vllm_plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["bielik_tools"]

# Ship the parser files and the chat template from tools/ inside the package,
# so that a regular (non-editable) wheel install can locate them.
[tool.hatch.build.targets.wheel.force-include]
"tools" = "bielik_tools/tools"

[tool.hatch.build.targets.sdist]
include = ["bielik_tools", "tools", "README.md", "LICENSE"]
